# 博客站点 Nginx 配置
# 使用方法：
#   1. 修改 server_name 为你的域名
#   2. 修改 ssl_certificate / ssl_certificate_key 为实际证书路径
#   3. 放到 /etc/nginx/sites-available/follow_note 并软链到 sites-enabled

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name followxu.top www.followxu.top;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name followxu.top www.followxu.top;

    # 使用 certbot 时路径通常为：
    # ssl_certificate     /etc/letsencrypt/live/followxu.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/followxu.top/privkey.pem;
    ssl_certificate     /etc/nginx/ssl/followxu.top.pem;
    ssl_certificate_key /etc/nginx/ssl/followxu.top.key;

    # 上传限制（MDX 图片上传等）
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE 支持（Next.js 热更新、评论等需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（Next.js 的 _next/static 带内容哈希，可长期缓存）
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
